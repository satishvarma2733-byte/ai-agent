# Local development dependencies. Start with: docker compose up -d
# Then run the API with DATABASE_URL=postgresql://avn_app:avn_app_password@127.0.0.1:5432/avnagent
# (a regular role, so row-level security is enforced; see docker/postgres-init.sql)
services:
  db:
    # Postgres 16 + pgvector (knowledge-base vectors, see docs/product/02-trd.md T1)
    image: pgvector/pgvector:pg16
    container_name: avnagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: avnagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # New volume name: a Postgres 15 data directory cannot be opened by Postgres 16.
      - postgres16_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avnagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres16_data:
