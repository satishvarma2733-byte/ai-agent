name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci-test.db
      KB_DATA_DIR: ${{ github.workspace }}/ci-kb
      APP_DATA_DIR: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (errors only; style rules come later)
        run: ruff check . --select E9,F63,F7,F82 --exclude .venv
      - name: Unit tests
        run: |
          mkdir -p "$KB_DATA_DIR" "$APP_DATA_DIR"
          python -m unittest discover -s app/tests -p "*test*.py" -t . -v
      - name: OpenAPI schema is up to date
        run: python -m scripts.export_openapi --check
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true  # report-only until existing advisories are triaged

  backend-postgres:
    # Production runs on Postgres with row-level security, which SQLite can't exercise.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: avnagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avnagent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: local
      PGPASSWORD: postgrespassword
      # The app role is not a superuser, so row-level security applies (as in docker/postgres-init.sql).
      DATABASE_URL: postgresql://avn_app:avn_app_password@127.0.0.1:5432/avnagent
      TEST_DATABASE_URL: postgresql://avn_app:avn_app_password@127.0.0.1:5432/avnagent_test
      KB_DATA_DIR: ${{ github.workspace }}/ci-kb
      APP_DATA_DIR: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Create app role and databases
        run: |
          psql -h 127.0.0.1 -U postgres -d avnagent -c "CREATE ROLE avn_app LOGIN PASSWORD 'avn_app_password'"
          psql -h 127.0.0.1 -U postgres -d avnagent -c "ALTER DATABASE avnagent OWNER TO avn_app"
          psql -h 127.0.0.1 -U postgres -d avnagent -c "CREATE DATABASE avnagent_test OWNER avn_app"
          for db in avnagent avnagent_test; do
            psql -h 127.0.0.1 -U postgres -d "$db" -c "CREATE EXTENSION IF NOT EXISTS vector"
          done
      - name: Migrations apply, match the models and roll back
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Unit tests on Postgres
        run: |
          mkdir -p "$KB_DATA_DIR" "$APP_DATA_DIR"
          python -m unittest discover -s app/tests -p "*test*.py" -t . -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npm run lint
        continue-on-error: true  # existing violations; becomes blocking after the token migration (plan 3.0c)

  docker:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t avn-api:ci .
